name: Publish container images

on:
  workflow_call:
    inputs:
      release_tag:
        description: Verified release tag to build and publish
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Verify backend
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go test ./...

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Verify Canvas Agent
        working-directory: canvas-agent
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test

      - name: Verify web
        working-directory: web
        run: |
          bun run typecheck
          bun run test
          bun run build

  publish:
    name: Publish ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: open-ai-canvas-web
            dockerfile: Dockerfile
          - image: open-ai-canvas-backend
            dockerfile: backend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Resolve and validate build version
        id: build-info
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$RELEASE_TAG" == v* ]]; then
            [[ "$version" == "$RELEASE_TAG" ]] || { echo "VERSION=$version does not match tag $RELEASE_TAG" >&2; exit 1; }
            grep -Fqx "## $version" CHANGELOG.md || { echo "CHANGELOG.md is missing ## $version" >&2; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_tag=${version#v}" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "is_semver=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_semver=false" >> "$GITHUB_OUTPUT"
          fi
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.revision=${{ steps.build-info.outputs.commit }}
          tags: |
            type=raw,value=${{ steps.build-info.outputs.image_tag }}
            type=semver,pattern={{version}},value=${{ steps.build-info.outputs.version }},enable=${{ steps.build-info.outputs.is_semver == 'true' }}
            type=raw,value=sha-${{ steps.build-info.outputs.commit }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.build-info.outputs.version }}
            BUILD_COMMIT=${{ steps.build-info.outputs.commit }}
            BUILD_TIME=${{ steps.build-info.outputs.build_time }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Publish release assets
    if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build Host Updater
        working-directory: backend
        shell: bash
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "../dist/open-ai-canvas-host-updater-linux-$arch" ./cmd/host-updater
          done
          cd ../dist
          sha256sum open-ai-canvas-host-updater-linux-* > SHA256SUMS

      - name: Prepare release notes
        shell: bash
        run: |
          version="$RELEASE_TAG"
          awk -v heading="## $version" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          test -s dist/RELEASE_NOTES.md || printf '映雪 %s\n' "$version" > dist/RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease_args=()
          if [[ "$RELEASE_TAG" == *-* || "$RELEASE_TAG" == *.rc* ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/open-ai-canvas-host-updater-linux-amd64 \
            dist/open-ai-canvas-host-updater-linux-arm64 \
            dist/SHA256SUMS \
            docker-compose.deploy.yml \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            "${prerelease_args[@]}"
