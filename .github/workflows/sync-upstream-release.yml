name: Sync upstream and publish Yingxue

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'luxueqi123/yingxue'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve stable upstream version
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(gh api repos/ddcat-ai/open-ai-canvas/releases/latest --jq '.tag_name')"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+){2,3}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch --no-tags https://github.com/ddcat-ai/open-ai-canvas.git "refs/tags/$tag"

      - name: Merge upstream into Yingxue
        id: merge
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        shell: bash
        run: |
          base="$(git rev-parse --short=12 HEAD)"
          candidate="codex/sync-$UPSTREAM_TAG-$base"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/remotes/origin/$candidate"; then
            git switch --detach "refs/remotes/origin/$candidate"
            exit 0
          fi
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-ff --no-commit FETCH_HEAD; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/merge-conflicts.txt"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            printf '影策 %s 与映雪合并有冲突，未发布更新包。\n' "$UPSTREAM_TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git commit -m "feat(sync): 上游更新 - 合并影策 $UPSTREAM_TAG"

      - uses: actions/upload-artifact@v4
        if: failure() && steps.merge.outputs.conflict == 'true'
        with:
          name: upstream-${{ steps.upstream.outputs.tag }}-conflicts
          path: ${{ runner.temp }}/merge-conflicts.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish only through the release gates
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          CANDIDATE_BRANCH: ${{ steps.merge.outputs.candidate }}
        shell: bash
        run: |
          [[ "$(tr -d '\r\n' < VERSION)" == "$UPSTREAM_TAG" ]]
          tag="$(git tag --points-at HEAD --list 'v*-yingxue.*' --sort=-version:refname | sed -n '1p')"
          if [[ -z "$tag" ]]; then
            tag="v$(date -u +%Y.%-m.%-d)-yingxue.$GITHUB_RUN_NUMBER"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$tag" -m "映雪 · 影策 $UPSTREAM_TAG"
            git push --atomic origin "HEAD:refs/heads/$CANDIDATE_BRANCH" "refs/tags/$tag"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --silent 2>"$RUNNER_TEMP/release-check.err"; then
            exit 0
          fi
          if ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-check.err"; then
            cat "$RUNNER_TEMP/release-check.err" >&2
            exit 1
          fi
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-images.yml/runs?head_sha=$(git rev-parse HEAD)" --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [[ "$active" == 0 ]]; then
            gh workflow run publish-images.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          fi
