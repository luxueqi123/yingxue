name: Sync upstream and publish Yingxue

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'luxueqi123/yingxue'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve verified Yingxue baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '
            [.[] | select(.draft == false and .prerelease == false and any(.assets[]; .name == "yingxue-update.json" and .state == "uploaded"))]
            | first.tag_name // empty
          ')"
          if [[ -n "$tag" ]]; then
            git fetch --no-tags origin "refs/tags/$tag"
            echo "commit=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve stable upstream version
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(gh api repos/ddcat-ai/open-ai-canvas/releases/latest --jq '.tag_name')"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+){2,3}$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch --no-tags https://github.com/ddcat-ai/open-ai-canvas.git "refs/tags/$tag"
          echo "commit=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into Yingxue
        id: merge
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.commit }}
          BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
        shell: bash
        run: |
          if [[ -n "$BASELINE_COMMIT" ]] && git merge-base --is-ancestor "$UPSTREAM_COMMIT" "$BASELINE_COMMIT" &&
             [[ "$(git show "$BASELINE_COMMIT:VERSION" | tr -d '\r\n')" == "$UPSTREAM_TAG" ]]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "影策 $UPSTREAM_TAG 对应的映雪安装包已发布。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="$(git rev-parse --short=12 HEAD)"
          baseline="${BASELINE_COMMIT:0:12}"
          candidate="codex/sync-$UPSTREAM_TAG-$base${baseline:+-$baseline}"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          merge_or_report() {
            if ! git merge "$@"; then
              git diff --name-only --diff-filter=U > "$RUNNER_TEMP/merge-conflicts.txt"
              if git rev-parse --quiet --verify MERGE_HEAD >/dev/null; then git merge --abort; fi
              echo "conflict=true" >> "$GITHUB_OUTPUT"
              printf '影策 %s 与映雪合并失败，现网继续使用已发布版本。\n' "$UPSTREAM_TAG" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }

          if git show-ref --verify --quiet "refs/remotes/origin/$candidate"; then
            git switch --detach "refs/remotes/origin/$candidate"
            git merge-base --is-ancestor "$base" HEAD
            git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD
            if [[ -n "$BASELINE_COMMIT" ]]; then git merge-base --is-ancestor "$BASELINE_COMMIT" HEAD; fi
            exit 0
          fi
          if [[ -n "$BASELINE_COMMIT" ]]; then
            merge_or_report --ff -m "chore(sync): 更新基线 - 合入最近发布的映雪版本" "$BASELINE_COMMIT"
          fi
          if ! git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD; then
            merge_or_report --no-ff -m "feat(sync): 上游更新 - 合并影策 $UPSTREAM_TAG" "$UPSTREAM_COMMIT"
          fi

      - uses: actions/upload-artifact@v4
        if: failure() && steps.merge.outputs.conflict == 'true'
        with:
          name: upstream-${{ steps.upstream.outputs.tag }}-conflicts
          path: ${{ runner.temp }}/merge-conflicts.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish only through the release gates
        if: steps.merge.outputs.up_to_date != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          CANDIDATE_BRANCH: ${{ steps.merge.outputs.candidate }}
        shell: bash
        run: |
          [[ "$(tr -d '\r\n' < VERSION)" == "$UPSTREAM_TAG" ]]
          tag="$(git tag --points-at HEAD --list 'v*-yingxue.*' --sort=-version:refname | sed -n '1p')"
          if [[ -z "$tag" ]]; then
            tag="v$(date -u +%Y.%-m.%-d)-yingxue.$GITHUB_RUN_NUMBER"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "$tag" -m "映雪 · 影策 $UPSTREAM_TAG"
            git push --atomic origin "HEAD:refs/heads/$CANDIDATE_BRANCH" "refs/tags/$tag"
          fi
          if published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '
            .draft == false and .prerelease == false and any(.assets[]; .name == "yingxue-update.json" and .state == "uploaded")
          ' 2>"$RUNNER_TEMP/release-check.err")"; then
            if [[ "$published" == true ]]; then exit 0; fi
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-check.err"; then
            cat "$RUNNER_TEMP/release-check.err" >&2
            exit 1
          fi
          active="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-images.yml/runs?head_sha=$(git rev-parse HEAD)" --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [[ "$active" == 0 ]]; then
            gh workflow run publish-images.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          fi
